name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_cards.py, fetch_contributions.py, fonts/**, assets/**]

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Refresh data/contributions.json
        env:
          # GITHUB_TOKEN counts public contributions. To include private ones, add a
          # classic PAT with read:user as the repo secret GH_STATS_TOKEN.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: KrxnTech
        run: python fetch_contributions.py

      - name: Render cards
        run: python build_cards.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
