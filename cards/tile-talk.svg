<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 244" width="292" height="244" role="img" aria-labelledby="t d"><title id="t">TALK: Say hi</title><desc id="d">Backend, DevOps or MERN work? Find me on LinkedIn.</desc><style>@font-face{font-family:KMono;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:KSerif;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:KSerif;font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:KSans;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
.f-serif,.f-serifi{font-family:KSerif,"Instrument Serif",Georgia,serif;font-weight:400}
.f-serifi{font-style:italic}
.f-sans,.f-sansm{font-family:KSans,"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
